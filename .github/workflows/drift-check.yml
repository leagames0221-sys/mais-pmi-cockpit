name: drift-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: internal knowledge base 5 file 存在 check (doctrine: handoff-duty)
        run: |
          set -e
          for f in productContext activeContext decisionLog systemPatterns logbook; do
            test -f "(internal config)/internal_kb/${f}.md" || { echo "missing internal_kb/${f}.md"; exit 1; }
          done

      - name: Tier 2 CLAUDE.md 存在 check
        run: test -f CLAUDE.md

      - name: README literal file ref 実在 check
        run: |
          set -e
          test -f requirements-week0.txt
          test -f docs/discovery_brief.md
          test -f .github/dependabot.yml

      - name: internal ADR cross-repo citation marker check
        run: |
          grep -r "mais-deal-matching" CLAUDE.md README.md (internal config)/internal_kb/ docs/ || { echo "internal ADR inherit citation missing"; exit 1; }

      - name: T2 sibling citation check (T2 既存 5-stage + Docling reuse marker)
        run: |
          grep -r "mais-dd-workbench" CLAUDE.md README.md (internal config)/internal_kb/ docs/ || { echo "T2 sibling citation missing"; exit 1; }

      - name: T3 sibling citation check (T3 → T4 入出力契約 ADR-302 inherit marker)
        run: |
          grep -r "mais-day1-cockpit" CLAUDE.md README.md (internal config)/internal_kb/ docs/ || { echo "T3 sibling citation missing"; exit 1; }

      - name: video-pipeline cross-PJ SSoT citation check
        run: |
          grep -rE "(video-pipeline|TTS engine)" CLAUDE.md README.md (internal config)/internal_kb/ docs/ || { echo "video-pipeline cross-PJ SSoT citation missing"; exit 1; }

      - name: PII boundary check (operational に PII field 名 literal 出現禁止、 T4 module 構造)
        run: |
          set -e
          # Blocklist (PII field literal 禁止): src/orchestrator + src/kpi + src/anomaly + src/driver
          # + src/next_action + src/sentiment + src/vendor + src/dashboard + src/pipeline
          # + src/operational + src/citation + src/api + src/llm (LLM 内 PII 保持禁止、 ADR-304 順守)
          # Allowlist (PII field literal 可、 schema / data_gen / integration ingestion path / vault 内):
          # src/schema (type 定義) + src/data_gen (合成 data 生成 Faker output) + src/integration
          # (T3 ingestion field 名遭遇可) + src/vault (vault 内必要)
          ! grep -rE "(name_full|email|phone|address_full|raw_self_intro|raw_description|name_kana|dob_exact|contact_email|contact_phone|contact_person|raw_text|employee_name|vendor_contact|saas_account_holder|contract_signatory|employee_id_real)" src/orchestrator/ src/kpi/ src/anomaly/ src/driver/ src/next_action/ src/sentiment/ src/vendor/ src/dashboard/ src/pipeline/ src/operational/ src/citation/ src/api/ src/llm/ 2>/dev/null || { echo "PII field 名 literal in disallowed module"; exit 1; }

      - name: pip-audit --disable-pip flag 不在 verify (T2 学び doctrine: analogical-recall)
        # pip-audit.yml の run: 行で actual command として --disable-pip が使われていないか check。
        # comment 行 (#-prefix) + 本 verify step 内 grep 検索 string は **self-referential false positive 回避**
        # のため exclude、 pip-audit.yml の `run:` line に絞って literal scan する。
        run: |
          set -e
          ! grep -E "^\s*run:.*pip-audit.*--disable-pip" .github/workflows/pip-audit.yml 2>/dev/null || { echo "T2 真 bug 再発: pip-audit --disable-pip flag が actual command として検出 (T2 commit 76eb283 で literal fix 済の同 pattern)"; exit 1; }

      - name: Run pytest (fast only, slow integration tests deselected)
        # Week 1+3 active stack: langgraph 1.2.0+ + sklearn + pandas + transformers + torch +
        # docling + sentence-transformers + faiss-cpu + rank-bm25 + llama-index-core
        # ADR-301/305 6 軸 mitigation 軸 ① pin version literal CI で verify
        run: |
          if [ -d tests ] && find tests -name "test_*.py" | grep -q .; then
            pip install -r requirements-week3.txt
            pytest -m "not slow" tests/
          else
            echo "no tests yet (scaffold phase)"
          fi
